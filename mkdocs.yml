site_name: Fleting Docs
site_url: https://alexyucra.github.io/Fleting/

theme:
  name: material
  logo: img/fleting_logo.png
  favicon: img/fleting_logo.png
  language: en
  features:      
    - navigation.sections   
    - content.code.copy 
    - navigation.indexes  

nav:
  - Home: index.md
  - English:
      - Databases: en/database.md
      - Step-by-step examples: en/examples.md
  - Português:
      - Início: pt/index.md
      - Arquitetura: pt/arquitetura.md
      - Checklist: pt/checklist.md
      - CLI: pt/cli.md
      - Bancos de dados: pt/banco-de-dados.md
      - Exemplos passo a passo: pt/exemplos.md
      - Ambiente: pt/enviroment.md
  - Español:
      - Inicio: es/index.md
      - Arquitectura: es/arquitectura.md
      - Checklist: es/checklist.md
      - CLI: es/cli.md
      - Bases de datos: es/base-de-datos.md
      - Ejemplos paso a paso: es/ejemplos.md
      - Entorno: es/enviroment.md
  - Contribuir: CONTRIBUTING.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: pt
          name: Português
          build: true
        - locale: es
          name: Español
          build: true


