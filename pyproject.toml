[project]
name = "fleting"
version = "1.3.0"
description = "Micro-framework MVC baseado em Flet para aplicações mobile, tablet e desktop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

authors = [{name = "Alex Yucra", email = "xalextrack@gmail.com"}]

keywords = [
    "fleting",
    "fleting framework",
    "pip install fleting",
    "flet",
    "framework",
    "mvc",
    "ui",
    "desktop",
    "mobile",
    "apk",
    "app",
    "android"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "flet==1.0.5",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
mysql = ["mysql-connector-python>=8.0"]
mariadb = ["PyMySQL>=1.1"]

# ------------------------
# CLI ENTRY POINT
# ------------------------
[project.scripts]
fleting = "fleting.cli.cli:main"

# ------------------------
# URLs (PyPI)
# ------------------------
[project.urls]
Homepage = "https://github.com/alexyucra/fleting"
Documentation = "https://github.com/alexyucra/fleting/tree/main/docs"
Repository = "https://github.com/alexyucra/fleting"
Issues = "https://github.com/alexyucra/fleting/issues"

# ------------------------
# BUILD SYSTEM (Poetry)
# ------------------------
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ------------------------
# TESTES
# ------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 110
extend-exclude = ["fleting/cli/templates"]   # templates são strings geradas (ver 03-M2)

[tool.ruff.lint]
select = ["E9", "F", "E722"]
